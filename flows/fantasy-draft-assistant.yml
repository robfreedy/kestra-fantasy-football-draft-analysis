id: fantasy-draft-assistant
namespace: test.robs-test
description: |
  Fantasy Football Draft Decision Assistant

  This workflow monitors your Sleeper fantasy football draft in real-time
  and provides recommendations for available players based on value scoring.

  Configuration:
  1. Set SLEEPER_LEAGUE_ID environment variable to your league ID
  2. Adjust polling frequency in the cron expression (currently every 30 seconds)
  3. Monitor logs during your draft for alerts and recommendations
  '

variables:
  SLEEPER_LEAGUE_ID: "926225845410648064"  # Set this via environment or UI

# Trigger: Manual for MVP, or use schedule if you want to run during specific windows
tasks:
  - id: check-league-status
    type: io.kestra.plugin.scripts.python.Commands
    runner: PROCESS
    containerImage: python:3.11
    beforeCommands:
      - pip install requests pandas pytz aiohttp
    commands:
      - python ./fantasy_football_analyzer.py
    env:
      SLEEPER_LEAGUE_ID: "{{ env.SLEEPER_LEAGUE_ID }}"
    outputFiles:
      - draft_analysis.json
    
  - id: parse-analysis
    type: io.kestra.plugin.core.http.Request
    method: GET
    url: "draft_analysis.json"
    
  - id: check-for-alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.parse-analysis.body.high_value_alerts > 0 }}"
    then:
      - id: alert-user
        type: io.kestra.plugin.core.log.Log
        message: |
          🚨 DRAFT ALERT! 🚨
          High-value picks available!
          
          Top Recommendations:
          {% for item in outputs.parse-analysis.body.recommendations %}
            {% if item.alert %}
          ⭐ {{ item.rank }}. {{ item.name }} ({{ item.position }}) - Value: {{ item.value_score }}
            {% endif %}
          {% endfor %}
          
          Picks made: {{ outputs.parse-analysis.body.draft_status.picks_made }}
          Remaining: {{ outputs.parse-analysis.body.draft_status.picks_remaining }}
    else:
      - id: status-update
        type: io.kestra.plugin.core.log.Log
        message: |
          Draft Status Update - {{ outputs.parse-analysis.body.timestamp }}
          Picks: {{ outputs.parse-analysis.body.draft_status.picks_made }} / {{ outputs.parse-analysis.body.draft_status.picks_made | plus: outputs.parse-analysis.body.draft_status.picks_remaining }}
          
          Top 5 Available:
          {% for item in outputs.parse-analysis.body.recommendations %}
          {{ item.rank }}. {{ item.name }} ({{ item.position }}) - Value: {{ item.value_score }}
          {% endfor %}
  
  - id: save-history
    type: io.kestra.plugin.core.flow.AllMatch
    tasks:
      - id: append-to-log
        type: io.kestra.plugin.scripts.python.Commands
        runner: PROCESS
        commands:
          - |
            import json
            from datetime import datetime
            
            # Read current analysis
            with open('draft_analysis.json', 'r') as f:
              data = json.load(f)
            
            # Append to history file
            with open('draft_history.jsonl', 'a') as f:
              f.write(json.dumps(data) + '\n')
            
            print("Analysis saved to history")