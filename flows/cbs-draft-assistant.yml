id: cbs-draft-assistant
namespace: cbs-sports

description: |
  CBS Sports Fantasy Football Draft Decision Assistant

  Polls a live CBS Sports Fantasy draft and logs the best-value players still
  on the board, weighted by what my roster still needs. The twins of this flow
  are `sleeper-draft-assistant` in the `sleeper` namespace and
  `yahoo-draft-assistant` in `yahoo-sports`; the scoring is identical and lives
  in `draft_analysis.py`, which each namespace keeps its own copy of.

  Setup:
    1. Upload `cbs_fantasy_analyzer.py` and `draft_analysis.py` as Namespace
       Files in the `cbs-sports` namespace. A change to `draft_analysis.py` has
       to be uploaded to `sleeper` and `yahoo-sports` as well.
    2. Add three KV store entries in this namespace: CBS_CLIENT_ID,
       CBS_CLIENT_SECRET and CBS_USER_ID. `scripts/cbs_access_token.sh` loads
       them, and the access token, for you. Namespace Secrets would be the
       better home, but `kestra.secret.type` is unset on this instance - see
       the comment on the `analyze_draft` env block.
    3. Set `league_id` to your league's CBS subdomain - the `myleague` in
       https://myleague.football.cbssports.com/ . The league URL works in
       place of the bare id.
    4. Enable the `poll_during_draft` trigger while the draft is running.

  CBS is the only one of the three providers that publishes the draft order
  before the draft starts, so whose turn it is - including a custom or keeper
  order - is read off the board rather than inferred.

  A player's expected pick is their CBS overall ranking. CBS also publishes an
  average-draft-position resource, which would be better, but it has answered
  every request with HTTP 500 for as long as this flow has existed.

labels:
  owner: rob
  domain: fantasy-football
  provider: cbs

inputs:
  - id: league_id
    type: STRING
    required: true
    defaults: ""
    description: >
      The CBS league to watch, identified by its subdomain - the `myleague` in
      https://myleague.football.cbssports.com/ . The full league URL can be
      pasted in place of the bare id. This is not your CBS user id.

  - id: alert_threshold
    type: FLOAT
    required: true
    defaults: 10.0
    description: Flag a player once they have fallen this many picks past their rank.

  - id: top_n
    type: INT
    required: true
    defaults: 5
    description: How many recommendations to report each poll.

  - id: exclude_positions
    type: STRING
    required: true
    defaults: "K,DEF"
    description: >
      Positions to leave out of recommendations. CBS's overall ranking carries
      no kickers or defenses at all, so excluding them costs nothing and keeps
      the roster-need report from listing slots that can never be filled.

  - id: flex_penalty
    type: FLOAT
    required: true
    defaults: 8.0
    description: >
      Picks to discount a player who only fills a flex slot rather than a
      starting one.

  - id: depth_penalty
    type: FLOAT
    required: true
    defaults: 20.0
    description: >
      Picks to discount a player at a position whose starting slots are already
      filled, multiplied up the deeper the roster already is there. Raise this
      to suppress backups harder; set both penalties to 0 to ignore my roster
      and rank purely on value.

  - id: rankings_source
    type: STRING
    required: true
    defaults: "cbs_avg_ppr"
    description: >
      Which CBS overall ranking to score against: `cbs_avg_ppr` for a PPR
      league or `cbs_avg` for non-PPR. CBS silently serves `cbs_avg_ppr` for
      anything else it does not recognize, which the analyzer logs and reports
      as the run's `rankings_source`.

  - id: cbs_base_url
    type: STRING
    required: true
    defaults: "https://api.cbssports.com/fantasy"
    description: CBS API root. Override only to point at a test fixture.

  - id: cbs_token_url
    type: STRING
    required: true
    defaults: "https://api.cbssports.com/general/oauth"
    description: CBS OAuth root. Override only to point at a test fixture.

tasks:
  - id: read_cached_token
    type: io.kestra.plugin.core.kv.Get
    description: >
      The access token cached by an earlier poll. Missing on the first run,
      which is fine - the analyzer mints one from the stored credentials.
    key: cbs_access_token
    errorOnMissing: false

  - id: analyze_draft
    type: io.kestra.plugin.scripts.python.Commands
    description: Pull the live draft from CBS and score the remaining players.
    namespaceFiles:
      enabled: true
      include:
        - cbs_fantasy_analyzer.py
        - draft_analysis.py
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13-slim
    beforeCommands:
      - pip install --quiet --no-cache-dir requests
    env:
      CBS_LEAGUE_ID: "{{ inputs.league_id }}"
      CBS_BASE_URL: "{{ inputs.cbs_base_url }}"
      CBS_TOKEN_URL: "{{ inputs.cbs_token_url }}"
      CBS_RANKINGS_SOURCE: "{{ inputs.rankings_source }}"
      # These come from the KV store rather than Namespace Secrets, whose
      # backend is disabled on this instance because `kestra.secret.type` is
      # unset. `kv()` errors on a missing key, so a half-configured namespace
      # fails loudly here rather than sending an unauthenticated request to
      # CBS. Trade-off: unlike `secret()`, KV values are NOT masked in
      # execution logs. Move these back to `secret()` once the setting is in
      # place.
      CBS_CLIENT_ID: "{{ kv('CBS_CLIENT_ID') }}"
      CBS_CLIENT_SECRET: "{{ kv('CBS_CLIENT_SECRET') }}"
      CBS_USER_ID: "{{ kv('CBS_USER_ID') }}"
      # Absent on the first poll; `??` keeps the expression resolvable, which a
      # plain reference to a missing KV value is not.
      CBS_ACCESS_TOKEN: "{{ outputs.read_cached_token.value.access_token ?? '' }}"
      ALERT_THRESHOLD: "{{ inputs.alert_threshold }}"
      TOP_N: "{{ inputs.top_n }}"
      EXCLUDE_POSITIONS: "{{ inputs.exclude_positions }}"
      REQUIRE_NFL_TEAM: "true"
      FLEX_PENALTY: "{{ inputs.flex_penalty }}"
      DEPTH_PENALTY: "{{ inputs.depth_penalty }}"
      OUTPUT_FILE: draft_analysis.json
    commands:
      - python cbs_fantasy_analyzer.py
    outputFiles:
      - draft_analysis.json

  - id: cache_access_token
    type: io.kestra.plugin.core.flow.If
    description: >
      Store a freshly minted token so later polls reuse it. CBS publishes no
      expiry for these, so the cache entry is simply given a long TTL; if CBS
      ever rejects it, the next poll mints another from the stored credentials.
    condition: "{{ outputs.analyze_draft.vars.token.minted ?? false }}"
    then:
      - id: write_access_token
        type: io.kestra.plugin.core.kv.Set
        key: cbs_access_token
        kvType: JSON
        overwrite: true
        ttl: P30D
        value: "{{ outputs.analyze_draft.vars.token | toJson }}"

  - id: route_by_draft_status
    type: io.kestra.plugin.core.flow.Switch
    description: Only the live-draft branch is worth acting on.
    value: "{{ outputs.analyze_draft.vars.analysis.draft_status.status }}"
    cases:
      drafting:
        - id: check_for_alerts
          type: io.kestra.plugin.core.flow.If
          condition: "{{ outputs.analyze_draft.vars.analysis.high_value_alerts > 0 }}"
          then:
            - id: alert_user
              type: io.kestra.plugin.core.log.Log
              level: WARN
              message: |
                🚨 DRAFT ALERT! 🚨
                CBS draft {{ outputs.analyze_draft.vars.analysis.draft_info.name }} ({{ outputs.analyze_draft.vars.analysis.league_id }})
                {{ outputs.analyze_draft.vars.analysis.high_value_alerts }} high-value player(s) still on the board.

                Round {{ outputs.analyze_draft.vars.analysis.draft_status.current_round }}, pick {{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} of {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }}
                On the clock: draft slot {{ outputs.analyze_draft.vars.analysis.on_the_clock.slot ?? 'unknown' }}{% if outputs.analyze_draft.vars.analysis.on_the_clock.is_my_pick ?? false %} — THAT'S YOU, PICK NOW{% endif %}

                Starters still needed: {{ outputs.analyze_draft.vars.analysis.roster_needs.still_needed_summary }}

                Best picks for my roster:
                {% for item in outputs.analyze_draft.vars.analysis.recommendations %}{% if item.alert %}⭐ {{ item.name }} ({{ item.position }} – {{ item.nfl_team }}) — ranked #{{ item.expected_pick | numberFormat('#.###') }}, still here at #{{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} — {{ item.need }}, score {{ item.adjusted_score | numberFormat('#.###') }}{% if item.need_penalty > 0 %} (value {{ item.value_score | numberFormat('#.###') }} less {{ item.need_penalty | numberFormat('#.###') }} for {{ item.need }}){% endif %}
                {% endif %}{% endfor %}
          else:
            - id: status_update
              type: io.kestra.plugin.core.log.Log
              message: |
                CBS draft update: {{ outputs.analyze_draft.vars.analysis.draft_info.name }} ({{ outputs.analyze_draft.vars.analysis.league_id }}) — {{ outputs.analyze_draft.vars.analysis.timestamp }}
                Round {{ outputs.analyze_draft.vars.analysis.draft_status.current_round }}, pick {{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} of {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }} ({{ outputs.analyze_draft.vars.analysis.draft_status.picks_remaining }} remaining)
                On the clock: draft slot {{ outputs.analyze_draft.vars.analysis.on_the_clock.slot ?? 'unknown' }}{% if outputs.analyze_draft.vars.analysis.on_the_clock.is_my_pick ?? false %} — THAT'S YOU{% endif %}
                No one has fallen more than {{ outputs.analyze_draft.vars.analysis.alert_threshold | numberFormat('#.###') }} picks past their rank.

                My roster: {{ outputs.analyze_draft.vars.analysis.my_roster_summary }}
                Starters still needed: {{ outputs.analyze_draft.vars.analysis.roster_needs.still_needed_summary }}

                Best picks for my roster:
                {% for item in outputs.analyze_draft.vars.analysis.recommendations %}{{ item.rank }}. {{ item.name }} ({{ item.position }} – {{ item.nfl_team }}) — rank #{{ item.expected_pick | numberFormat('#.###') }}, {{ item.need }}, score {{ item.adjusted_score | numberFormat('#.###') }}{% if item.need_penalty > 0 %} (value {{ item.value_score | numberFormat('#.###') }} less {{ item.need_penalty | numberFormat('#.###') }}){% endif %}
                {% endfor %}

      pre_draft:
        - id: not_started
          type: io.kestra.plugin.core.log.Log
          message: |
            CBS draft for {{ outputs.analyze_draft.vars.analysis.league_id }} has not started yet.
            {{ outputs.analyze_draft.vars.analysis.draft_status.teams }} teams × {{ outputs.analyze_draft.vars.analysis.draft_status.rounds }} rounds = {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }} picks.
            {% if outputs.analyze_draft.vars.analysis.my_draft_slot ?? false %}Your draft slot: {{ outputs.analyze_draft.vars.analysis.my_draft_slot }}{% else %}Your draft slot is not known yet{% endif %}

      complete:
        - id: draft_finished
          type: io.kestra.plugin.core.log.Log
          message: |
            CBS draft for {{ outputs.analyze_draft.vars.analysis.league_id }} is complete — {{ outputs.analyze_draft.vars.analysis.draft_status.picks_made }} picks made.
            Final roster: {{ outputs.analyze_draft.vars.analysis.my_roster_summary }}
            You can disable the `poll_during_draft` trigger now.

    defaults:
      - id: unexpected_status
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "CBS reports draft state '{{ outputs.analyze_draft.vars.analysis.draft_status.status }}' — nothing to recommend."

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: >
      Keep the latest analysis in the KV store so a later run (or another flow)
      can diff against it. Every run's full draft_analysis.json is also kept in
      internal storage as the durable history.
    key: cbs_last_draft_analysis
    kvType: JSON
    overwrite: true
    ttl: P7D
    value: "{{ outputs.analyze_draft.vars.analysis | toJson }}"

triggers:
  - id: poll_during_draft
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    description: >
      Enable this while your draft is live. Polls every minute rather than
      every 30 seconds like the Sleeper flow: each CBS poll costs seven API
      calls (league details, rules, draft config, draft order, draft board,
      teams, and the ranking) where a Sleeper poll costs two, and CBS's v3.0
      API is deprecated and publishes no rate limit worth testing.
    # Scheduled runs get the inputs' default values, so `league_id` above must
    # have the right default before this is enabled.
    cron: "* * * * *"
    # A slow CBS response should not stack up overlapping polls.
    allowConcurrent: false
