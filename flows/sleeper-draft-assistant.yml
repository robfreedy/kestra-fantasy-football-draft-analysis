id: sleeper-draft-assistant
namespace: sleeper

description: |
  Sleeper Fantasy Football Draft Decision Assistant

  Polls a live Sleeper draft and logs the best-value players still on the
  board, raising an alert when someone falls well past their ranking.

  Setup:
    1. Upload `sleeper_fantasy_analyzer.py` and `draft_analysis.py` as
       Namespace Files in the `sleeper` namespace (the `analyze_draft` task
       loads both from there). `draft_analysis.py` is the provider-agnostic
       scoring logic; the Yahoo twin of this flow lives in `yahoo-sports` and
       keeps its own copy of that file, so a change to the scoring model has to
       be uploaded to both namespaces.
    2. Set `league_or_draft_id` to whichever id you have - a league id from
       https://sleeper.com/leagues/<league_id>/... or a draft id from
       https://sleeper.com/draft/nfl/<draft_id>. Which kind it is gets
       detected automatically, so a MOCK draft (which belongs to no league,
       and so has only a draft id) is configured exactly like a league draft.
       It is NOT your user id. The full URL works in place of the id.
    3. Set `user_id` to have the flow tell you when you are on the clock.
       Your username works as well as your numeric id.
    4. Enable the `poll_during_draft` trigger while the draft is running.

  A player's value score is how many picks past their expected slot they
  are still available. Positive is value, negative is a reach.

  Recommendations are then adjusted for what I have already drafted: a player
  at a position whose starting slots are full is discounted, so a backup
  quarterback stops outranking a starter I still need. `flex_penalty` and
  `depth_penalty` control how hard that bites.

labels:
  owner: rob
  domain: fantasy-football
  provider: sleeper

inputs:
  - id: league_or_draft_id
    type: STRING
    required: true
    defaults: "1398327930542669824"
    description: >
      The Sleeper league or draft to watch - either kind of id works, and which
      one you gave is detected automatically. A league id is the number in
      https://sleeper.com/leagues/<league_id>/... ; a draft id is the number in
      https://sleeper.com/draft/nfl/<draft_id>. Use a draft id to follow a MOCK
      draft, which has no league to look it up by. The full URL can be pasted
      in place of the bare id. This is not your user id.

  - id: user_id
    type: STRING
    required: true
    defaults: "robfreedy"
    description: >
      Your Sleeper username or numeric user id, so the flow can tell you when it
      is your pick. A username is looked up automatically, because the draft
      order Sleeper returns is keyed by numeric id. Mock drafts against bots may
      not report a draft order at all.

  - id: alert_threshold
    type: FLOAT
    required: true
    defaults: 10.0
    description: Flag a player once they have fallen this many picks past their rank.

  - id: top_n
    type: INT
    required: true
    defaults: 5
    description: How many recommendations to report each poll.

  - id: exclude_positions
    type: STRING
    required: true
    defaults: "K,DEF"
    description: >
      Positions to leave out of recommendations. Kickers and defenses carry a
      misleadingly strong Sleeper search rank for how late they are actually
      drafted, so they are excluded by default.

  - id: flex_penalty
    type: FLOAT
    required: true
    defaults: 8.0
    description: >
      Picks to discount a player who only fills a flex slot rather than a
      starting one.

  - id: depth_penalty
    type: FLOAT
    required: true
    defaults: 20.0
    description: >
      Picks to discount a player at a position whose starting slots are already
      filled, multiplied up the deeper the roster already is there. Raise this
      to suppress backups harder; set both penalties to 0 to ignore my roster
      and rank purely on value.

  - id: sleeper_base_url
    type: STRING
    required: true
    defaults: "https://api.sleeper.app/v1"
    description: Sleeper API root. Override only to point at a test fixture.

tasks:
  - id: analyze_draft
    type: io.kestra.plugin.scripts.python.Commands
    description: Pull the live draft from Sleeper and score the remaining players.
    namespaceFiles:
      enabled: true
      include:
        - sleeper_fantasy_analyzer.py
        - draft_analysis.py
        # Injected only once it exists; the first run builds it.
        - sleeper_players_cache.json
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.13-slim
    beforeCommands:
      - pip install --quiet --no-cache-dir requests
    env:
      SLEEPER_LEAGUE_OR_DRAFT_ID: "{{ inputs.league_or_draft_id }}"
      SLEEPER_USER_ID: "{{ inputs.user_id }}"
      SLEEPER_BASE_URL: "{{ inputs.sleeper_base_url }}"
      ALERT_THRESHOLD: "{{ inputs.alert_threshold }}"
      TOP_N: "{{ inputs.top_n }}"
      EXCLUDE_POSITIONS: "{{ inputs.exclude_positions }}"
      FLEX_PENALTY: "{{ inputs.flex_penalty }}"
      DEPTH_PENALTY: "{{ inputs.depth_penalty }}"
      OUTPUT_FILE: draft_analysis.json
    commands:
      - python sleeper_fantasy_analyzer.py
    outputFiles:
      - draft_analysis.json
      - sleeper_players_cache.json

  - id: persist_player_cache
    type: io.kestra.plugin.core.flow.If
    description: >
      Sleeper's player endpoint is ~14MB and they ask that it be called at most
      once a day. Each task run gets a clean working directory, so the pruned
      pool is stored as a namespace file and re-injected on later runs -
      otherwise a 30-second poll would refetch it every single time.
    condition: "{{ outputs.analyze_draft.vars.analysis.cache_refreshed }}"
    then:
      - id: upload_player_cache
        type: io.kestra.plugin.core.namespace.UploadFiles
        namespace: "{{ flow.namespace }}"
        conflict: OVERWRITE
        filesMap:
          sleeper_players_cache.json: "{{ outputs.analyze_draft.outputFiles['sleeper_players_cache.json'] }}"

  - id: route_by_draft_status
    type: io.kestra.plugin.core.flow.Switch
    description: Only the live-draft branch is worth acting on.
    value: "{{ outputs.analyze_draft.vars.analysis.draft_status.status }}"
    cases:
      drafting:
        - id: check_for_alerts
          type: io.kestra.plugin.core.flow.If
          condition: "{{ outputs.analyze_draft.vars.analysis.high_value_alerts > 0 }}"
          then:
            - id: alert_user
              type: io.kestra.plugin.core.log.Log
              level: WARN
              message: |
                🚨 DRAFT ALERT! 🚨
                {% if outputs.analyze_draft.vars.analysis.draft_info.is_mock %}Mock draft{% else %}Draft{% endif %} {{ outputs.analyze_draft.vars.analysis.draft_info.name }} ({{ outputs.analyze_draft.vars.analysis.draft_id }})
                {{ outputs.analyze_draft.vars.analysis.high_value_alerts }} high-value player(s) still on the board.

                Round {{ outputs.analyze_draft.vars.analysis.draft_status.current_round }}, pick {{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} of {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }}
                On the clock: draft slot {{ outputs.analyze_draft.vars.analysis.on_the_clock.slot }}{% if outputs.analyze_draft.vars.analysis.on_the_clock.is_my_pick %} — THAT'S YOU, PICK NOW{% endif %}

                Starters still needed: {% if outputs.analyze_draft.vars.analysis.roster_needs.still_needed is empty %}none — remaining picks are depth{% else %}{{ outputs.analyze_draft.vars.analysis.roster_needs.still_needed | join(', ') }}{% endif %}

                Best picks for my roster:
                {% for item in outputs.analyze_draft.vars.analysis.recommendations %}{% if item.alert %}⭐ {{ item.name }} ({{ item.position }} – {{ item.nfl_team }}) — ranked #{{ item.overall_rank }}, still here at #{{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} — {{ item.need }}, score {{ item.adjusted_score }}{% if item.need_penalty > 0 %} (value {{ item.value_score }} less {{ item.need_penalty }} for {{ item.need }}){% endif %}
                {% endif %}{% endfor %}
          else:
            - id: status_update
              type: io.kestra.plugin.core.log.Log
              message: |
                {% if outputs.analyze_draft.vars.analysis.draft_info.is_mock %}Mock draft{% else %}Draft{% endif %} update: {{ outputs.analyze_draft.vars.analysis.draft_info.name }} ({{ outputs.analyze_draft.vars.analysis.draft_id }}) — {{ outputs.analyze_draft.vars.analysis.timestamp }}
                Round {{ outputs.analyze_draft.vars.analysis.draft_status.current_round }}, pick {{ outputs.analyze_draft.vars.analysis.draft_status.current_pick }} of {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }} ({{ outputs.analyze_draft.vars.analysis.draft_status.picks_remaining }} remaining)
                On the clock: draft slot {{ outputs.analyze_draft.vars.analysis.on_the_clock.slot }}{% if outputs.analyze_draft.vars.analysis.on_the_clock.is_my_pick %} — THAT'S YOU{% endif %}
                No one has fallen more than {{ outputs.analyze_draft.vars.analysis.alert_threshold }} picks past their rank.

                My roster: {% for position, players in outputs.analyze_draft.vars.analysis.my_roster %}{{ position }} {{ players | length }}{% if not loop.last %}, {% endif %}{% endfor %}{% if outputs.analyze_draft.vars.analysis.my_roster is empty %}nothing drafted yet{% endif %}
                Starters still needed: {% if outputs.analyze_draft.vars.analysis.roster_needs.still_needed is empty %}none — remaining picks are depth{% else %}{{ outputs.analyze_draft.vars.analysis.roster_needs.still_needed | join(', ') }}{% endif %}

                Best picks for my roster:
                {% for item in outputs.analyze_draft.vars.analysis.recommendations %}{{ item.rank }}. {{ item.name }} ({{ item.position }} – {{ item.nfl_team }}) — rank #{{ item.overall_rank }}, {{ item.need }}, score {{ item.adjusted_score }}{% if item.need_penalty > 0 %} (value {{ item.value_score }} less {{ item.need_penalty }}){% endif %}
                {% endfor %}

      pre_draft:
        - id: not_started
          type: io.kestra.plugin.core.log.Log
          message: |
            Draft {{ outputs.analyze_draft.vars.analysis.draft_id }} has not started yet.
            {{ outputs.analyze_draft.vars.analysis.draft_status.teams }} teams × {{ outputs.analyze_draft.vars.analysis.draft_status.rounds }} rounds = {{ outputs.analyze_draft.vars.analysis.draft_status.total_picks }} picks.

      complete:
        - id: draft_finished
          type: io.kestra.plugin.core.log.Log
          message: |
            Draft {{ outputs.analyze_draft.vars.analysis.draft_id }} is complete — {{ outputs.analyze_draft.vars.analysis.draft_status.picks_made }} picks made.
            You can disable the `poll_during_draft` trigger now.

    defaults:
      - id: unexpected_status
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Draft is in state '{{ outputs.analyze_draft.vars.analysis.draft_status.status }}' — nothing to recommend."

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: >
      Keep the latest analysis in the KV store so a later run (or another flow)
      can diff against it. Every run's full draft_analysis.json is also kept in
      internal storage as the durable history.
    key: sleeper_last_draft_analysis
    kvType: JSON
    overwrite: true
    ttl: P7D
    value: "{{ outputs.analyze_draft.vars.analysis | toJson }}"

triggers:
  - id: poll_during_draft
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    description: Enable this while your draft is live. Polls every 30 seconds.
    # Scheduled runs get the inputs' default values, so `league_or_draft_id`
    # above must have the right default before this is enabled.
    cron: "*/30 * * * * *"
    withSeconds: true
    # A slow Sleeper response should not stack up overlapping polls.
    allowConcurrent: false
